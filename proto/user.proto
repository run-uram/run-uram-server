syntax = "proto3";

package user;

import "common.proto";

message GetUserProfileRequest {
  uint64 user_id = 1; // 0 = запросить свой профиль
}

message UserProfileResponse {
  common.Status status = 1;
  uint64 user_id = 2;
  string username = 3;
  string email = 4;
  string player_color_hex = 5;
  string avatar_url = 6;

  uint64 team_id = 7;
  string team_name = 8;
  string team_tag = 9;
  string team_color_hex = 10;
  string team_avatar_url = 11;

  double total_distance_meters = 12;
  int64 total_duration_seconds = 13;
  int32 total_runs = 14;
  int32 total_uram_points = 15;
  int32 current_held_hexagons = 16;
}