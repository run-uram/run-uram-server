syntax = "proto3";

package runuram.proto;

import "telemetry.proto";
import "events.proto";

message Envelope {
  oneof payload {
    events.StartRunRequest start_run_request = 1;
    events.StartRunResponse start_run_response = 2;
    telemetry.LocationBatch location_batch = 3;
    telemetry.LocationBatchAck location_batch_ack = 4;
    events.FinishRunRequest finish_run_request = 5;
    events.FinishRunResponse finish_run_response = 6;
  }
}